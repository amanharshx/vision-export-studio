name: CI

permissions:
  contents: read

run-name: >
  CI • ${{ github.event_name }} •
  ${{ github.ref_name }} •
  ${{ github.actor }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-22.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust }}
      structural: ${{ steps.filter.outputs.structural }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'src/**'
              - 'public/**'
              - 'index.html'
              - 'vite.config.ts'
              - 'package.json'
              - 'bun.lock'

            rust:
              - 'src-tauri/**'

            structural:
              - 'src/**/*.ts'
              - 'src/**/*.tsx'
              - 'src/**/*.js'
              - 'src/**/*.jsx'
              - 'src-tauri/src/**/*.rs'
              - 'src-tauri/python/**/*.py'
              - 'scripts/**/*.py'

  no-dist-changes:
    name: Block dist/ changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if dist/ changed
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -q '^dist/'; then
            echo "dist/ changes are not allowed in PRs."
            exit 1
          fi

  frontend:
    name: Frontend Check
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build

  rust:
    name: Rust Check
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  structural-quality:
    name: Structural Quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      STRUCTURAL_PATHS_MATCHED: ${{ needs.changes.outputs.structural }}
    needs: changes
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install analyzer
        run: python -m pip install lizard==1.24.0

      - name: Analyze changed functions
        if: needs.changes.outputs.structural == 'true'
        run: python scripts/structural_quality.py --base "$BASE_SHA" --head "$HEAD_SHA" --summary structural-quality.md

      - name: Report no matching source paths
        if: needs.changes.outputs.structural != 'true'
        run: |
          cat > structural-quality.md <<'EOF'
          ## Structural code quality

          ➖ No matching source paths. Analysis skipped.

          Informational only. Does not block merging.

          <!-- structural-code-quality -->
          EOF

      - name: Add job summary
        if: always()
        run: cat structural-quality.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update sticky PR comment
        if: github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('structural-quality.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes('<!-- structural-code-quality -->'));
            if (process.env.STRUCTURAL_PATHS_MATCHED !== 'true') {
              if (existing) {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
              }
              return;
            }
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  ci-pass:
    name: CI Pass
    if: always()
    needs: [frontend, rust, no-dist-changes]
    runs-on: ubuntu-22.04
    steps:
      - name: Check all required jobs passed
        run: |
          if [[ "${{ needs.frontend.result }}" == "failure" || "${{ needs.rust.result }}" == "failure" || "${{ needs.no-dist-changes.result }}" == "failure" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
          echo "All required CI jobs passed."
